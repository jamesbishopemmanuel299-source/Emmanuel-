name: Build Universal Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: universal-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build universal debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify Android project
        run: |
          test -f settings.gradle.kts || (echo "::error::settings.gradle.kts is missing"; exit 1)
          test -f app/build.gradle.kts || (echo "::error::app/build.gradle.kts is missing"; exit 1)
          test -f app/src/main/AndroidManifest.xml || (echo "::error::AndroidManifest.xml is missing"; exit 1)

      - name: Build one universal APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK_PATH="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::Gradle finished but no debug APK was produced."
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "APK: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Emmanuel-universal-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
